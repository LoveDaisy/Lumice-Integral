[project]
name = "lumice-integral"
version = "0.1.0"
description = "Deterministic coarea renderer for ice halos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.7,<1",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

